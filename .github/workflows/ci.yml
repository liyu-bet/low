name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: low-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Dummy only — never production secrets
      DATABASE_URL: postgresql://low:low@127.0.0.1:5432/low
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-password-not-used
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma format check
        run: npx prisma format --check

      - name: Prisma validate
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Dummy .env for compose config
        run: |
          printf 'DATABASE_URL=postgresql://low:ci-password@postgres:5432/low\nPOSTGRES_PASSWORD=ci-password\n' > .env

      - name: Compose config (dev)
        env:
          POSTGRES_USER: low
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: low
          DATABASE_URL: postgresql://low:ci-password@postgres:5432/low
        run: docker compose config -q

      - name: Compose config (prod)
        env:
          POSTGRES_USER: low
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: low
          DATABASE_URL: postgresql://low:ci-password@postgres:5432/low
        run: docker compose -f docker-compose.prod.yml config -q
