name: Publish images and deploy

# Deploy only after CI quality-gate succeeds on main (no race with parallel push).
# Manual dispatch re-runs the e2e quality gate unless an explicit emergency override is set.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_skip_quality:
        description: "Emergency only — type SKIP_QUALITY to deploy without re-running e2e"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: low-production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/liyu-bet/low-web
  IMAGE_WORKER: ghcr.io/liyu-bet/low-worker

jobs:
  ci-gate:
    name: Require CI success
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: CI must succeed (validate + e2e)
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "workflow_run conclusion=${CONCLUSION} event=${EVENT_NAME} branch=${HEAD_BRANCH} sha=${HEAD_SHA}"
          if [ "${EVENT_NAME}" != "push" ]; then
            echo "Skipping publish for non-push CI runs (e.g. pull_request)"
            exit 1
          fi
          if [ "${CONCLUSION}" != "success" ]; then
            echo "CI did not succeed — blocking deploy"
            exit 1
          fi

  manual-e2e:
    name: Manual deploy e2e gate
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm_skip_quality != 'SKIP_QUALITY'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: low_e2e
          POSTGRES_USER: low_e2e
          POSTGRES_PASSWORD: low_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U low_e2e -d low_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://low_e2e:low_e2e_password@127.0.0.1:5432/low_e2e
      SESSION_SECRET: e2e-session-secret-at-least-32-characters
      ADMIN_EMAIL: bootstrap@example.test
      ADMIN_PASSWORD: bootstrap-test-password
      E2E_EMAIL: admin@example.test
      E2E_PASSWORD: admin-test-password
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run e2e:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ci
      - name: Scrub storageState before upload
        if: failure()
        run: rm -rf .playwright
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-manual-e2e-${{ github.run_id }}
          retention-days: 7
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  manual-override:
    name: Emergency override acknowledged
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm_skip_quality == 'SKIP_QUALITY'
    runs-on: ubuntu-latest
    steps:
      - name: Warn
        run: echo "::warning::Deploying with SKIP_QUALITY — e2e gate bypassed by explicit override"

  build-and-push:
    needs: [ci-gate, manual-e2e, manual-override]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_run' && needs.ci-gate.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.manual-e2e.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.manual-override.result == 'success')
      )
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - name: Resolve checkout ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(echo ${{ steps.ref.outputs.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:latest
            ${{ env.IMAGE_WORKER }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    env:
      LOW_IMAGE_TAG: ${{ needs.build-and-push.outputs.short_sha }}
    steps:
      - name: Resolve checkout ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx.low.conf.example,deploy/backup-postgres.sh,deploy/smoke-test.sh,deploy/rollback.sh"
          target: /var/www/low
          overwrite: true

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          LOW_IMAGE_TAG: ${{ needs.build-and-push.outputs.short_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LOW_IMAGE_TAG
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/low
            test -f .env
            command -v docker >/dev/null
            docker compose version >/dev/null
            test -n "${LOW_IMAGE_TAG}"

            export LOW_IMAGE_TAG
            echo "Deploying LOW_IMAGE_TAG=${LOW_IMAGE_TAG}"

            chmod +x deploy/backup-postgres.sh deploy/smoke-test.sh deploy/rollback.sh

            COMPOSE=(docker compose -p low-production --env-file .env -f docker-compose.prod.yml)

            # Detect existing database volume/data (first deploy can skip backup)
            FIRST_DEPLOY=1
            if "${COMPOSE[@]}" ps --status running postgres 2>/dev/null | grep -q postgres; then
              FIRST_DEPLOY=0
            elif docker volume ls -q | grep -qx 'low-production_low_postgres_data'; then
              # Volume exists from prior run even if container stopped
              FIRST_DEPLOY=0
            fi

            "${COMPOSE[@]}" pull

            "${COMPOSE[@]}" up -d postgres

            echo "Waiting for postgres healthy..."
            for i in $(seq 1 45); do
              if "${COMPOSE[@]}" ps postgres | grep -qi healthy; then
                break
              fi
              sleep 2
              if [ "$i" -eq 45 ]; then
                echo "Postgres not healthy in time"
                "${COMPOSE[@]}" logs --tail=80 postgres || true
                exit 1
              fi
            done

            if [ "${FIRST_DEPLOY}" = "0" ]; then
              echo "Existing database detected — mandatory verified backup"
              ./deploy/backup-postgres.sh /var/www/low
            else
              echo "First deploy — backup skipped (no existing database)"
            fi

            "${COMPOSE[@]}" --profile migrate run --rm migrate

            "${COMPOSE[@]}" up -d web worker

            sleep 8
            ./deploy/smoke-test.sh http://127.0.0.1:8082

            echo "Running images:"
            "${COMPOSE[@]}" ps
            WEB_IMG="$("${COMPOSE[@]}" ps --format '{{.Image}}' web || true)"
            WORKER_IMG="$("${COMPOSE[@]}" ps --format '{{.Image}}' worker || true)"
            echo "web_image=${WEB_IMG}"
            echo "worker_image=${WORKER_IMG}"
            echo "${WEB_IMG}" | grep -q "${LOW_IMAGE_TAG}"
            echo "${WORKER_IMG}" | grep -q "${LOW_IMAGE_TAG}"
