name: Publish images and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: low-production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/liyu-bet/low-web
  IMAGE_WORKER: ghcr.io/liyu-bet/low-worker

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://low:low@127.0.0.1:5432/low
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-password-not-used
      NEXT_TELEMETRY_DISABLED: "1"
      POSTGRES_USER: low
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: low
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dummy .env for compose config
        run: |
          printf 'DATABASE_URL=postgresql://low:ci-password@postgres:5432/low\n' > .env
      - name: Compose config (prod)
        run: docker compose -f docker-compose.prod.yml config -q
      - name: Compose config (dev)
        run: docker compose config -q

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: worker
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:latest
            ${{ env.IMAGE_WORKER }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on server
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    env:
      LOW_IMAGE_TAG: ${{ needs.build-and-push.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx.low.conf.example,deploy/backup-postgres.sh,deploy/smoke-test.sh,deploy/rollback.sh"
          target: /var/www/low
          overwrite: true

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          LOW_IMAGE_TAG: ${{ needs.build-and-push.outputs.short_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LOW_IMAGE_TAG
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/low
            test -f .env
            command -v docker >/dev/null
            docker compose version >/dev/null
            test -n "${LOW_IMAGE_TAG}"

            export LOW_IMAGE_TAG
            echo "Deploying LOW_IMAGE_TAG=${LOW_IMAGE_TAG}"

            chmod +x deploy/backup-postgres.sh deploy/smoke-test.sh deploy/rollback.sh

            COMPOSE=(docker compose -p low-production --env-file .env -f docker-compose.prod.yml)

            # Detect existing database volume/data (first deploy can skip backup)
            FIRST_DEPLOY=1
            if "${COMPOSE[@]}" ps --status running postgres 2>/dev/null | grep -q postgres; then
              FIRST_DEPLOY=0
            elif docker volume ls -q | grep -qx 'low-production_low_postgres_data'; then
              # Volume exists from prior run even if container stopped
              FIRST_DEPLOY=0
            fi

            "${COMPOSE[@]}" pull

            "${COMPOSE[@]}" up -d postgres

            echo "Waiting for postgres healthy..."
            for i in $(seq 1 45); do
              if "${COMPOSE[@]}" ps postgres | grep -qi healthy; then
                break
              fi
              sleep 2
              if [ "$i" -eq 45 ]; then
                echo "Postgres not healthy in time"
                "${COMPOSE[@]}" logs --tail=80 postgres || true
                exit 1
              fi
            done

            if [ "${FIRST_DEPLOY}" = "0" ]; then
              echo "Existing database detected — mandatory verified backup"
              ./deploy/backup-postgres.sh /var/www/low
            else
              echo "First deploy — backup skipped (no existing database)"
            fi

            "${COMPOSE[@]}" --profile migrate run --rm migrate

            "${COMPOSE[@]}" up -d web worker

            sleep 8
            ./deploy/smoke-test.sh http://127.0.0.1:8082

            echo "Running images:"
            "${COMPOSE[@]}" ps
            WEB_IMG="$("${COMPOSE[@]}" ps --format '{{.Image}}' web || true)"
            WORKER_IMG="$("${COMPOSE[@]}" ps --format '{{.Image}}' worker || true)"
            echo "web_image=${WEB_IMG}"
            echo "worker_image=${WORKER_IMG}"
            echo "${WEB_IMG}" | grep -q "${LOW_IMAGE_TAG}"
            echo "${WORKER_IMG}" | grep -q "${LOW_IMAGE_TAG}"
