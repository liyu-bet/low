services:
  postgres:
    image: postgres:16
    container_name: low-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-low}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-low}
    volumes:
      - low_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-low} -d ${POSTGRES_DB:-low}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Bound to localhost only — separate from DSD/GSC Postgres instances
    ports:
      - "127.0.0.1:5433:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: low-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: low-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  low_postgres_data:
